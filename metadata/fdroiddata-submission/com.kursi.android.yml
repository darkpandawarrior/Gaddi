# Gaddi — submission for the OFFICIAL fdroiddata repo (metadata/com.kursi.android.yml at
# gitlab.com/fdroid/fdroiddata), NOT for the self-hosted repo. The self-hosted equivalent lives at
# ../com.kursi.android.yml and targets darkpandawarrior's own F-Droid index; that file is untouched.
#
# Every field below was checked live against F-Droid's current (2026) docs on 2026-08-26, not
# written from memory. Sources are cited inline. See README.md next to this file for the fork/MR
# commands, the checks to run before opening the MR, and what was deliberately left out.

Categories:
  - Games
