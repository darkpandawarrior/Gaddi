# F-Droid build metadata for Gaddi (noGms flavor).
# Companion to fastlane/metadata/android/en-US/ (marketing copy) and NOTICE (attribution).
# Keep License: in lockstep with the repo's LICENSE file, checked by
# scripts/check-license-consistency.sh, or the F-Droid build breaks.

Categories:
  - Games
License: GPL-3.0-or-later
AuthorName: Siddharth Pandalai

SourceCode: https://github.com/darkpandawarrior/Gaddi
IssueTracker: https://github.com/darkpandawarrior/Gaddi/issues

RepoType: git
Repo: https://github.com/darkpandawarrior/Gaddi

# noGms release APK is unsigned unless ANDROID_KEYSTORE_* secrets are configured; the tag-triggered
# github-release.yml build is what actually lands on every `v*` push, and it names the noGms
# release APK with `-unsigned` appended whenever no signing cert is present in it (see the "Build
# Android artifacts" step: name="${name}-unsigned" when the APK has no META-INF/*.RSA|DSA|EC).
# F-Droid's own reproducible build is the noGms flavor built straight from source:
Build:
  - versionName: 2026.07.30.1.190
    versionCode: 191
    commit: v2026.07.30.1.190
    subdir: cmp-android
    gradle:
      - noGms
    output: build/outputs/apk/noGms/release/cmp-android-noGms-release-unsigned.apk

# AllowedAPKSigningKeys pins F-Droid's own signed build to the SAME cert as the developer-signed
# release from publish-fdroid.yml (workflow_dispatch, apksigner + ANDROID_KEYSTORE_* secrets), so
# users can switch between the F-Droid repo and a sideloaded GitHub Release APK without a
# signature-mismatch uninstall. Fingerprint is lowercase hex, no colons, from the release keystore.
AllowedAPKSigningKeys: e3cd9ed25baaa6db5501621a2a7399edc0878022f9b64b5d95446db0348dd19c

# Binaries lets F-Droid verify its from-source build byte-for-byte against the developer's own
# signed artifact instead of trusting the build alone. Asset name comes straight from
# .github/workflows/publish-fdroid.yml's `gh release upload`: "Kursi-${tag}.apk" where ${tag} is
# the pushed tag verbatim (the tag already carries the leading "v").
Binaries: https://github.com/darkpandawarrior/Gaddi/releases/download/%v/Kursi-%v.apk

# Tags follow the fingerprint versioning scheme (docs/RELEASE.md / gradle/versioning.gradle.kts):
# v<YYYY>.<0M>.<0W>.<MILESTONE>.<commitCount>, e.g. v2026.07.30.1.190. AutoUpdateMode: Version
# derives versionName/versionCode from the matched tag automatically on each new release.
AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+\.[0-9]+$

CurrentVersion: 2026.08.35.1.234
CurrentVersionCode: 235
