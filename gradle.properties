# Daemon JVM args. This string is the FLEET FINGERPRINT — Gradle reuses a daemon only when the
# Java home and the JVM args are byte-identical, so Candidai/Doori/Gaddi share one daemon
# instead of one each. The previous `-Xmx3g -Dfile.encoding=UTF-8` was not a decision: it arrived
# verbatim in the scaffold commit (6c87298) and was never revisited, and it made this repo the only
# one on its own fingerprint. Measured 2026-09-21: `./gradlew help` spawned an 8th daemon (PID
# 52335, -Xmx3g) on a host that already had five daemons on the 4g string and 9.4 GB of swap in use.
# MaxMetaspaceSize is the load-bearing part: overriding org.gradle.jvmargs drops Gradle's own 384m
# default and leaves metaspace unbounded, and the Kotlin daemon inherits -Xmx/-XX:MaxMetaspaceSize
# from here when kotlin.daemon.jvmargs is unset (which it deliberately is — one less number to guess).
# Do not edit one value in isolation: any change breaks daemon sharing until the fleet follows.
org.gradle.jvmargs=-Xmx4g -Xms1g -XX:MaxMetaspaceSize=1536m -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
# Configuration cache, in Gradle's default `fail` mode. The former `problems=warn` line is gone:
# warn stores the entry despite problems, so the build stays green while a task runs against
# incomplete deserialized state. Measured 2026-09-21 with --configuration-cache-problems=fail over
# every graph CI exercises (:cmp-android:assembleGmsDebug, :cmp-ios:linkDebugFrameworkIosSimulatorArm64,
# :cmp-desktop:assemble, :server:assemble, ktlintCheck, detekt, jvmTest — 1565 tasks):
# BUILD SUCCESSFUL, totalProblemCount 0. Onboarding is over; the gate is real now.
#
# org.gradle.configuration-cache.parallel was removed, not lost. It is still INCUBATING in 9.8
# ("some builds may not work correctly") and it bought nothing here: cold-store A/B on `help`
# measured 8.38s off vs 8.27s on, and warm loads were if anything slower with it. An incubating
# flag carried for a 0.11s delta is just an extra suspect in the next weird-build investigation.
#
# Isolated Projects is deliberately NOT enabled. The property was renamed in Gradle 9.7 to
# org.gradle.isolated-projects (org.gradle.unsafe.isolated-projects is now a deprecated alias on a
# removal path, so any advice still using that spelling predates 9.7). The constraint is upstream of
# Gradle: KGP has no project-isolation support — KT-57279, open and unresolved as of 2026-09-21.
# To inventory violations without a red build: ./gradlew help -Dorg.gradle.isolated-projects.diagnostics=true
org.gradle.configuration-cache=true
kotlin.code.style=official
# Per-task Kotlin compile timings, written to build/reports/kotlin-build/ (NOT build/kotlin-build-report/,
# which is what the sibling repos' comments claim). Nothing here was measurable before this existed.
kotlin.build.report.output=file
android.useAndroidX=true
# Deliberately NOT set: android.nonTransitiveRClass. Default=true and ApiStage.Stable since AGP 8.0;
# this repo is on 9.5.0-alpha06. Adding it changes nothing and schedules a deletion later.
# Incremental recompilation of klib artifacts into native code. Beta in Kotlin 2.4.20, opt-in.
kotlin.incremental.native=true
