name: CI

on:
  # Manual re-run. A branch pushed by a workflow using GITHUB_TOKEN does NOT trigger push or
  # pull_request runs (GitHub's loop prevention), so bot-authored PRs land with zero checks and
  # sit BLOCKED forever on required contexts that will never report. Until those pushes carry a
  # PAT or App token, this at least lets a human start the run without closing and reopening.
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# JVM tests live in quality.yml (ktlint · detekt · jvmTest). Desktop compile is covered
# by screenshots.yml (renderScreens compiles :cmp-desktop before rendering). iOS compile
# moved to ios.yml (path-filtered — macOS runner only runs when iOS-relevant code changes).
# This workflow is now just the Android assemble smoke-check.
jobs:
  # ── Android debug build ────────────────────────────────────────────────────
  android:
    name: Android Debug APK
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    steps:
      - uses: actions/checkout@v4
        with:
          # versionCode derives from `git rev-list --count HEAD`. A shallow clone
          # reports 1, which silently produced versionCode 2 on every published APK.
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.0
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-cleanup: on-success

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Assemble debug APK (Gms — the full-feature build that ships to Play/Indus)
        run: ./gradlew :cmp-android:assembleGmsDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kursi-debug-apk
          path: cmp-android/build/outputs/apk/gms/debug/*.apk
          retention-days: 2
