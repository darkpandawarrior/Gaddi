name: iOS

# iOS compile check runs on the macOS runner (~10× the cost of ubuntu) and links the
# ~1 GB Kotlin/Native toolchain. To keep PR CI cheap it runs:
#   • on every push to main (always — full safety net), and
#   • on PRs ONLY when iOS-relevant code changes (the shared KMP modules the iOS targets
#     compile, plus build config). Docs-only, web-only, desktop-only, android-only, and
#     server-only PRs skip the macOS leg entirely.
# The path list is deliberately conservative: any change to shared code still triggers it.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths:
      - 'engine/**'
      - 'ai/**'
      - 'game-services/**'
      - 'cmp-shared/**'
      - 'cmp-ios/**'
      - 'iosApp/**'
      - 'core/**'
      - 'feature/**'
      - 'shared-protocol/**'
      - 'gradle/**'
      - 'gradle.properties'
      - '**/*.gradle.kts'
      - '.github/workflows/ios.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-compile:
    name: iOS Compile Check
    runs-on: macos-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    steps:
      - uses: actions/checkout@v7
        with:
          # versionCode derives from `git rev-list --count HEAD`. A shallow clone
          # reports 1, which silently produced versionCode 2 on every published APK.
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-cleanup: on-success

      # Kotlin/Native toolchain (~1 GB) — cache keyed on version catalog
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-v1-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-v1-
            ${{ runner.os }}-konan-

      - name: Grant execute permission
        run: chmod +x ./gradlew

      # Compile the shared KMP modules for both iOS targets.
      - name: Compile KMP for iOS
        run: |
          ./gradlew \
            :engine:compileKotlinIosArm64 \
            :engine:compileKotlinIosSimulatorArm64 \
            :ai:compileKotlinIosSimulatorArm64 \
            :cmp-shared:compileKotlinIosSimulatorArm64

      # Compiling alone never catches a LINK break (a missing objc symbol, an unexported
      # transitive dependency, a framework the umbrella forgot to export()). That used to
      # surface only at tag time, in github-release.yml's ios-build-check. It runs green
      # there on macos-latest, so the same pair runs here on the PR gate instead — against
      # the simulator SDK, which is what the repo's iOS baseline is verified on.
      - name: Link KursiKit.framework (simulator)
        run: ./gradlew :cmp-ios:linkDebugFrameworkIosSimulatorArm64

      - name: Build iosApp (no codesign)
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
