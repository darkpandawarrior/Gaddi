name: Screenshots

# Self-maintaining render-harness baselines.
#
# The Gaddi render harness (`:cmp-desktop:renderScreens`) runs the Compose desktop JVM
# target headlessly and writes PNGs to cmp-desktop/build/shots/. CI runs on Linux (deterministic
# renderer) and copies the output to docs/screenshots/, then proposes any changed/new shots
# back via a bot-branch PR — so baselines are always in sync with code and never drift from
# CI's environment, without pushing straight to main.
#
# On PRs: shots are uploaded as an artifact for review, not committed.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # manual "refresh all baselines now"

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write        # allows the bot to push a refresh branch
  pull-requests: write   # allows the bot to open the baseline-refresh PR

jobs:
  render:
    name: Render & propose baselines
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    steps:
      - uses: actions/checkout@v7
        with:
          # versionCode derives from `git rev-list --count HEAD`. A shallow clone
          # reports 1, which silently produced versionCode 2 on every published APK.
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-cleanup: on-success

      - name: Grant execute permission
        run: chmod +x ./gradlew

      # Render all screen fixtures to cmp-desktop/build/shots/
      - name: Render screenshots
        run: ./gradlew :cmp-desktop:renderScreens

      # Copy to docs/screenshots/ for committed baselines
      - name: Copy to docs/screenshots
        run: |
          mkdir -p docs/screenshots
          cp -r cmp-desktop/build/shots/. docs/screenshots/

      # Skia does not promise byte-identical output between runs, and the step below decides
      # "did anything change?" with `git diff` — a BYTE comparison. Measured 2026-08-15:
      # 4p_chit_dossier.png differed from a fresh render by ONE pixel, blue channel, delta 1, out
      # of 1,296,000. Three bytes. That was enough to open a baseline-refresh PR on every run;
      # two were stacked open at once and #64 proposed content byte-identical to main.
      #
      # This restores files whose difference is below threshold so the git diff that follows sees
      # only changes a human would see. It is a filter, never a gate — anything above threshold
      # stays staged and the PR opens exactly as before.
      - name: Drop rasterisation noise
        run: |
          python3 -m pip install --quiet --disable-pip-version-check Pillow
          python3 scripts/drop-screenshot-noise.py docs/screenshots

      # main: baselines drifted. Push straight to main bypasses review and can race other
      # pushes, so open a refresh PR instead (idempotent branch name per source SHA; re-runs
      # force-push the same branch and reuse the open PR). gh pr create is made non-fatal so a
      # sandbox/permissions issue with PR creation never hard-fails this job — the branch is
      # still pushed either way.
      - name: Open baseline-refresh PR
        if: github.event_name == 'push'
        env:
          # A PUSH made with GITHUB_TOKEN fires no workflows, so the refresh commit landed on the
          # bot branch with no checks and the PR sat BLOCKED forever (Doori #208, 2026-09-22).
          # CONSUMER_DISPATCH_TOKEN is a PAT, and a PAT-authored push does trigger them.
          # Deliberately NOT set as `token:` on actions/checkout: that persists the PAT in
          # .git/config for every later step, including a full Gradle build with third-party
          # plugins. Scoping it to this one step keeps the credential out of the build.
          #
          # NO `|| github.token` fallback here, matching bump-toolkit.yml: a fallback guards the
          # wrong failure. It engages on an UNSET secret (empty, falsy) while a WRONG value is
          # truthy and wins, so the one case it cannot catch is the one that actually happened —
          # this secret once held an unsubstituted placeholder and checkout died with
          # "could not read Username" in all four repos. A hard reference fails loudly instead.
          GH_TOKEN: ${{ secrets.CONSUMER_DISPATCH_TOKEN }}
          PUSH_TOKEN: ${{ secrets.CONSUMER_DISPATCH_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots unchanged — nothing to commit."
            exit 0
          fi
          # Stable branch name, NOT per-SHA: the push below is a force-push, so one branch
          # and one open PR get reused for every refresh. A ${GITHUB_SHA}-suffixed branch
          # opened a fresh PR per commit to main, and they stacked up conflicting on the
          # same PNGs (7 open at once in Gaddi, 2 in Doori on 2026-08-27).
          branch="bot/refresh-screenshot-baselines"
          git checkout -b "$branch"
          git commit -m "chore(screenshots): refresh baselines for ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch"
          if ! gh pr list --head "$branch" --state open --json number --jq '.[0].number' | grep -q .; then
            gh pr create --base main --head "$branch" \
              --title "chore(screenshots): refresh render-harness baselines" \
              --body "Automated render-harness baseline refresh — screens changed on main and CI re-rendered them. Review the PNG diffs and merge." \
              || echo "::warning::gh pr create failed (branch $branch was still pushed) — open the PR manually if needed."
          fi

      # PR: upload for human review
      - name: Upload screenshots (PR review)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        # An artifact is a convenience; the account's 500 MB artifact quota must not fail the gate.
        continue-on-error: true
        with:
          name: gaddi-screenshots
          path: docs/screenshots/
          retention-days: 2
