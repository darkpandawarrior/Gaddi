name: Deploy to Huawei AppGallery

# Uploads the Gms-flavor release APK via AppGallery Connect's Publish API (community action). Gated
# on HUAWEI_CLIENT_ID: no Connect API key exists yet, so this job no-ops until one is created in
# AppGallery Connect (Users and permissions → API Key → Connect API).

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # A run with no HAS_SECRET skips every step below and still exits green — GitHub shows a
    # checkmark even though nothing was built or uploaded. "Report deploy status" always runs so
    # the summary says so explicitly instead of letting a green check imply a real deploy happened.
    env:
      HAS_SECRET: ${{ secrets.HUAWEI_CLIENT_ID != '' }}
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    steps:
      - name: Report deploy status
        run: |
          if [ "${{ env.HAS_SECRET }}" = "true" ]; then
            echo "Deploying to Huawei AppGallery." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Not deployed to Huawei AppGallery" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No store credentials are configured, so every build and upload step was skipped." >> "$GITHUB_STEP_SUMMARY"
            echo "This run is green because nothing failed, NOT because the app was published." >> "$GITHUB_STEP_SUMMARY"
            echo "Set the required secrets to enable it: HUAWEI_CLIENT_ID, HUAWEI_CLIENT_KEY, HUAWEI_APP_ID." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v4
        with:
          # versionCode derives from `git rev-list --count HEAD`. A shallow clone
          # reports 1, which silently produced versionCode 2 on every published APK.
          fetch-depth: 0
          submodules: recursive
        if: env.HAS_SECRET == 'true'

      - name: Set up JDK 17
        if: env.HAS_SECRET == 'true'
        uses: actions/setup-java@v6.0.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        if: env.HAS_SECRET == 'true'
        uses: gradle/actions/setup-gradle@v6.3.0

      - run: chmod +x ./gradlew
        if: env.HAS_SECRET == 'true'

      - name: Materialize signing secrets
        if: env.HAS_SECRET == 'true'
        run: |
          set -euo pipefail
          mkdir -p secrets
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > secrets/kursi-release.keystore
            {
              echo "RELEASE_STORE_FILE=$PWD/secrets/kursi-release.keystore"
              echo "RELEASE_STORE_PASSWORD=${KEYSTORE_PASSWORD:-}"
              echo "RELEASE_KEY_ALIAS=${KEY_ALIAS:-kursi}"
              echo "RELEASE_KEY_PASSWORD=${KEY_PASSWORD:-}"
            } >> "$GITHUB_ENV"
          fi
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build release APK (Gms)
        if: env.HAS_SECRET == 'true'
        run: ./gradlew :cmp-android:assembleGmsRelease

      - name: Upload to Huawei AppGallery
        if: env.HAS_SECRET == 'true'
        uses: muhamedzeema/appgallery-deply-action@main
        with:
          client-id: ${{ secrets.HUAWEI_CLIENT_ID }}
          client-key: ${{ secrets.HUAWEI_CLIENT_KEY }}
          app-id: ${{ secrets.HUAWEI_APP_ID }}
          file-extension: apk
          file-path: cmp-android/build/outputs/apk/gms/release/cmp-android-gms-release.apk
          submit: true
