name: Quality Gate

on:
  # Manual re-run. A branch pushed by a workflow using GITHUB_TOKEN does NOT trigger push or
  # pull_request runs (GitHub's loop prevention), so bot-authored PRs land with zero checks and
  # sit BLOCKED forever on required contexts that will never report. Until those pushes carry a
  # PAT or App token, this at least lets a human start the run without closing and reopening.
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ktlint · detekt · jvmTest
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"

    steps:
      - uses: actions/checkout@v4
        with:
          # versionCode derives from `git rev-list --count HEAD`. A shallow clone
          # reports 1, which silently produced versionCode 2 on every published APK.
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.0
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-cleanup: on-success

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Code style (ktlint)
        run: ./gradlew ktlintCheck

      # !cancelled() so all three checks always report in one run — a ktlint failure
      # doesn't hide the detekt/test results (replaces the old separate JVM Tests job).
      - name: Static analysis (detekt)
        if: ${{ !cancelled() }}
        run: ./gradlew detekt

      - name: JVM tests
        if: ${{ !cancelled() }}
        run: ./gradlew jvmTest --continue

      - name: Upload detekt report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-report
          path: '**/build/reports/detekt/'
          retention-days: 2

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/reports/tests/'
          retention-days: 2
