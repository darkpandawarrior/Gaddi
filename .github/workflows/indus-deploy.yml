name: Deploy to Indus Appstore

# Publishes the release AAB to Indus Appstore via PhonePe's Indus-Flows action, matching the
# pattern used by PaymentsLab/Mileway. Gated on INDUS_API_KEY: this repo's signing secrets are
# placeholders until configured (see keystore.properties.template), so this job no-ops until set.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build & deploy AAB
    runs-on: ubuntu-latest
    # A run with no HAS_SECRET skips every step below and still exits green — GitHub shows a
    # checkmark even though nothing was built or uploaded. "Report deploy status" always runs so
    # the summary says so explicitly instead of letting a green check imply a real deploy happened.
    env:
      HAS_SECRET: ${{ secrets.INDUS_API_KEY != '' }}
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    steps:
      - name: Report deploy status
        run: |
          if [ "${{ env.HAS_SECRET }}" = "true" ]; then
            echo "Deploying to Indus Appstore." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Not deployed to Indus Appstore" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No store credentials are configured, so every build and upload step was skipped." >> "$GITHUB_STEP_SUMMARY"
            echo "This run is green because nothing failed, NOT because the app was published." >> "$GITHUB_STEP_SUMMARY"
            echo "Set the required secrets to enable it: INDUS_API_KEY, INDUS_APP_ID." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v4
        with:
          # versionCode derives from `git rev-list --count HEAD`. A shallow clone
          # reports 1, which silently produced versionCode 2 on every published APK.
          fetch-depth: 0
          submodules: recursive
        if: env.HAS_SECRET == 'true'

      - name: Set up JDK 17
        if: env.HAS_SECRET == 'true'
        uses: actions/setup-java@v6.0.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        if: env.HAS_SECRET == 'true'
        uses: gradle/actions/setup-gradle@v6.3.0

      - run: chmod +x ./gradlew
        if: env.HAS_SECRET == 'true'

      # Materialize signing secrets from base64 repo secrets (placeholders until configured).
      - name: Materialize signing secrets
        if: env.HAS_SECRET == 'true'
        run: |
          set -euo pipefail
          mkdir -p secrets
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > secrets/kursi-release.keystore
            {
              echo "RELEASE_STORE_FILE=$PWD/secrets/kursi-release.keystore"
              echo "RELEASE_STORE_PASSWORD=${KEYSTORE_PASSWORD:-}"
              echo "RELEASE_KEY_ALIAS=${KEY_ALIAS:-kursi}"
              echo "RELEASE_KEY_PASSWORD=${KEY_PASSWORD:-}"
            } >> "$GITHUB_ENV"
          fi
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build release AAB (Gms — the full-feature build; noGms is F-Droid-only)
        if: env.HAS_SECRET == 'true'
        run: ./gradlew :cmp-android:bundleGmsRelease

      - name: Deploy to Indus Appstore
        if: env.HAS_SECRET == 'true'
        uses: PhonePe/Indus-Flows@v1
        with:
          app_bundle_path: 'cmp-android/build/outputs/bundle/gmsRelease/cmp-android-gms-release.aab'
          api_key: ${{ secrets.INDUS_API_KEY }}
          app_id: ${{ secrets.INDUS_APP_ID }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
